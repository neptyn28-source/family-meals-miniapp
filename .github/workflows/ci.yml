name: CI
on:
  push:
    branches: [main, production-hardening]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Planner, shopping, security tests
        run: npm test
      - name: Generate deterministic SQL seed from catalog
        run: npm run seed
      - name: Frontend syntax
        run: npm run check:frontend
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Type-check shared backend code with Deno
        run: deno check supabase/functions/_shared/planner/planner.ts supabase/functions/_shared/telegram.ts supabase/functions/_shared/scope.ts
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate seed
        run: npm run seed
      - name: Apply baseline + migrations + seed twice (idempotency)
        run: |
          for i in 1 2; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f scripts/test-baseline-schema.sql
            for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          done

  deploy:
    # Production deploy only from main, only after tests and migrations are green.
    needs: [test, migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: vwapvcpodwvfzfmtoxhz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
      - name: Skip if secrets are not configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::warning::SUPABASE_ACCESS_TOKEN not set — backend deploy skipped"; fi
      - name: Push migrations
        if: steps.guard.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" && supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        if: steps.guard.outputs.skip != 'true'
        run: |
          for fn in $(ls supabase/functions | grep -v '^_'); do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
