<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b26"><title>Family Money — семейный бюджет</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#162822;background:#f5f7f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 15px;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77b9a0;outline-offset:2px}.shell{max-width:900px;margin:auto;padding:20px 16px 100px}.hero{background:linear-gradient(130deg,#102b26,#255d4b);color:white;border-radius:26px;padding:25px;box-shadow:0 14px 35px #193f3020}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}.hero h1{font-size:clamp(28px,5vw,40px);margin:8px 0}.muted{color:#63746d}.hero .muted{color:#d1e6db}.balance{font-size:clamp(30px,6vw,45px);font-weight:800;letter-spacing:-.04em;margin:15px 0 4px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:white;border:1px solid #e4eae4;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 4px 16px #203d2608}.card h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#f2f7f2;padding:14px;border-radius:15px}.stat small{display:block;color:#60716b;margin-bottom:6px}.stat b{font-size:21px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.actions button{background:#e5f0e8;color:#194a35}.actions button.primary,.primary{background:#187452;color:white}.nav{display:flex;gap:6px;background:#e9eee8;padding:6px;border-radius:16px;margin:16px 0}.nav button{flex:1;padding:11px 5px;background:transparent;color:#52675d}.nav button.active{background:white;color:#164b37;box-shadow:0 2px 7px #0000000d}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #edf0ec;padding:12px 0}.item:last-child{border-bottom:0}.item strong{display:block}.item small{color:#6c7c73}.amount{font-weight:800;text-align:right;white-space:nowrap}.negative{color:#b43735}.bar{height:9px;border-radius:20px;background:#e9eee9;overflow:hidden;margin-top:8px}.fill{height:100%;background:#2c9472;border-radius:20px}.section-title{margin:20px 0 8px;font-size:17px}label{display:block;font-weight:650;font-size:14px;margin:14px 0}input,select{width:100%;padding:13px;border:1px solid #d4dfd7;border-radius:12px;margin-top:7px;background:white;color:#162822}input::placeholder{color:#9aa9a0}.form-actions{display:flex;gap:9px;margin-top:20px}.form-actions button{flex:1}.secondary{background:#edf2ee;color:#294f3d}.error{color:#b42318;min-height:1.2em}.hidden{display:none!important}.setup{max-width:480px;margin:8vh auto;padding:16px}.hint{font-size:13px;color:#6a796f;line-height:1.5}.empty{text-align:center;color:#64746b;padding:24px 8px}.tag{font-size:12px;border-radius:100px;padding:5px 9px;background:#e8f4e9;color:#266047}.footer{margin:25px 0;text-align:center;color:#78887d;font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a3f31;color:white;padding:13px 18px;border-radius:13px;box-shadow:0 8px 30px #0003;max-width:90%;z-index:5}@media(max-width:560px){.shell{padding:12px 12px 75px}.hero{padding:20px}.actions{grid-template-columns:repeat(2,1fr)}.grid{gap:8px}.stat b{font-size:18px}.nav button{font-size:13px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
"use strict";
const API="https://vwapvcpodwvfzfmtoxhz.supabase.co/functions/v1/family-budget";
let state=null,tab="overview",busy=false;
let token=localStorage.getItem("fbtoken");
if(!token){token=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem("fbtoken",token)}
const el=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Number(n||0)/100).toLocaleString("ru-RU",{minimumFractionDigits:0,maximumFractionDigits:2})+" ₽";
const parseMoney=s=>{const clean=String(s).replace(/\s/g,"").replace(",",".");if(!/^\d+(\.\d{1,2})?$/.test(clean))return null;const n=Math.round(Number(clean)*100);return Number.isSafeInteger(n)&&n>0&&n<=1e11?n:null};
const visible=()=>state.envelopes.filter(e=>!e.private_other&&e.type!=="system");
function notify(msg){const t=el("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3200)}
async function api(action,data={}){const res=await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-device-token":token},body:JSON.stringify({action,...data})});let json;try{json=await res.json()}catch{throw Error("Сервер вернул некорректный ответ")}if(!res.ok||!json.ok)throw Error(json.error||"Не удалось выполнить действие");return json}
function safeError(err){return esc(err?.message||"Неизвестная ошибка")}
async function boot(){el("app").innerHTML='<div class="setup"><div class="card"><h2>Загружаем семейный бюджет…</h2></div></div>';try{const data=await api("boot");data.setup?setup():update(data)}catch(err){el("app").innerHTML='<div class="setup"><div class="card"><h2>Нет соединения</h2><p class="error">'+safeError(err)+'</p><button class="primary" onclick="boot()">Повторить</button></div></div>'}}
function setup(){el("app").innerHTML='<div class="setup"><div class="hero"><div class="eyebrow">Family Money</div><h1>Деньги под контролем</h1><p class="muted">Один семейный бюджет, два телефона, понятные конверты.</p></div><div class="card"><h2>Начать работу</h2><form id="setupForm"><label>Ваше имя<input name="name" maxlength="70" required placeholder="Как к вам обращаться"></label><label>Роль<select name="role"><option value="husband">Муж</option><option value="wife">Жена</option></select></label><label>Название семьи<input name="family" maxlength="80" value="Наша семья"></label><label>Код приглашения (если вступаете в семью)<input name="code" placeholder="Оставьте пустым для создания семьи"></label><button class="primary" type="submit">Продолжить</button><p id="formError" class="error" role="alert"></p></form></div></div>';el("setupForm").onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget,d=new FormData(f),btn=f.querySelector("button");btn.disabled=true;try{const name=String(d.get("name")).trim(),code=String(d.get("code")).trim();if(!name)throw Error("Укажите имя");update(await api(code?"join":"create",code?{name,code}:{name,role:d.get("role"),family:String(d.get("family")).trim()||"Наша семья"}))}catch(err){el("formError").textContent=err.message;btn.disabled=false}}}
function update(data){state=data;render()}
function render(){const E=state.envelopes||[],sum=Number(state.total||0),goals=E.filter(e=>e.goal_amount>0&&!e.private_other),groups={};E.forEach(e=>(groups[e.group_name]??=[]).push(e));
const nav=[["overview","Обзор"],["envelopes","Конверты"],["goals","Цели"],["history","История"],["analytics","Аналитика"]];
el("app").innerHTML='<main class="shell"><header class="hero"><div class="topline"><div><div class="eyebrow">Family Money · '+esc(state.household.name)+'</div><h1>Семейный бюджет</h1></div><button class="secondary" onclick="refresh()" aria-label="Обновить данные">↻</button></div><div class="muted">Общий остаток</div><div class="balance">'+money(sum)+'</div><div class="muted">Привет, '+esc(state.member.name)+'!</div></header><div class="actions"><button class="primary" onclick="showForm(\'expense\')">− Расход</button><button onclick="showForm(\'income\')">+ Доход</button><button onclick="showForm(\'personal\')">+ Личный</button><button onclick="showForm(\'transfer\')">⇄ Перевод</button></div><section id="editor" aria-live="polite"></section><nav class="nav" aria-label="Разделы">'+nav.map(([id,label])=>'<button class="'+(tab===id?"active":"")+'" onclick="switchTab(\''+id+'\')">'+label+'</button>').join("")+'</nav><section id="content"></section><div class="footer">Данные синхронизируются через семейный сервер · <button class="secondary" onclick="exportSnapshot()">Экспорт конвертов CSV</button></div></main>';drawContent()}
function switchTab(v){tab=v;render()}
function drawContent(){const E=state.envelopes||[],goals=E.filter(e=>e.goal_amount>0&&!e.private_other),content=el("content");
if(tab==="overview"){const active=visible(),allocated=active.reduce((s,e)=>s+Number(e.balance||0),0),planned=active.reduce((s,e)=>s+Number(e.plan_amount||0),0);content.innerHTML='<div class="grid"><div class="stat"><small>Доступные конверты</small><b>'+active.length+'</b></div><div class="stat"><small>Остаток в доступных</small><b>'+money(allocated)+'</b></div><div class="stat"><small>План по конвертам</small><b>'+money(planned)+'</b></div><div class="stat"><small>Цели накоплений</small><b>'+goals.length+'</b></div></div><div class="card"><h2>Ваши конверты</h2>'+active.slice(0,7).map(envelopeRow).join("")+'<button class="secondary" onclick="switchTab(\'envelopes\')">Все конверты →</button></div><div class="card"><h2>Быстрый старт</h2><p class="hint">Записывайте каждую покупку в нужный конверт. После сохранения остатки обновятся для семьи.</p></div>'}
else if(tab==="envelopes"){const groups={};E.forEach(e=>(groups[e.group_name]??=[]).push(e));content.innerHTML=Object.entries(groups).map(([group,items])=>'<div class="card"><h2>'+esc(group)+'</h2>'+items.map(envelopeRow).join("")+'</div>').join("")||'<div class="card empty">Конвертов пока нет</div>'}
else if(tab==="analytics"){const ops=(state.operations||[]).filter(o=>E.some(e=>e.id===o.envelope_id&&!e.private_other));const now=new Date(),month=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");const expenses=ops.filter(o=>o.kind==="expense"&&String(o.op_date||o.created_at||"").startsWith(month));const total=expenses.reduce((v,o)=>v+Math.abs(Number(o.amount||0)),0);const byEnvelope={};expenses.forEach(o=>{byEnvelope[o.envelope_id]=(byEnvelope[o.envelope_id]||0)+Math.abs(Number(o.amount||0))});const rows=Object.entries(byEnvelope).sort((a,b)=>b[1]-a[1]);content.innerHTML='<div class="card"><h2>Расходы за '+esc(new Date().toLocaleDateString("ru-RU",{month:"long",year:"numeric"}))+'</h2><div class="balance" style="color:#162822">'+money(total)+'</div><p class="hint">По последним операциям, доступным серверу. Если операций больше 80, статистика неполная.</p>'+ (rows.length?rows.map(([id,value])=>{const e=E.find(x=>x.id===id);const pct=total?Math.round(value/total*100):0;return '<div class="item"><div style="flex:1"><strong>'+esc(e?.name||"Конверт")+'</strong><small>'+pct+'% расходов</small><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div><div class="amount">'+money(value)+'</div></div>'}).join(""):'<p class="empty">Расходов за этот месяц пока нет</p>')+'</div>'}
else if(tab==="history"){const byId=Object.fromEntries(E.map(e=>[e.id,e]));const ops=(state.operations||[]).filter(o=>byId[o.envelope_id]&&!byId[o.envelope_id].private_other);content.innerHTML='<div class="card"><h2>Последние операции</h2>'+(ops.length?ops.map(o=>'<div class="item"><div><strong>'+esc(byId[o.envelope_id]?.name||"Конверт")+'</strong><small>'+esc(o.kind)+' · '+esc(o.op_date||"")+'</small><small>'+esc(o.comment||"")+'</small></div><div class="amount '+(o.amount<0?"negative":"")+'">'+money(o.amount)+'</div></div>').join(""):'<p class="empty">Операций пока нет</p>')+'</div>'}
else{content.innerHTML='<div class="card"><h2>Финансовые цели</h2>'+ (goals.length?goals.map(e=>{const percent=Math.min(100,Math.max(0,Math.round(Number(e.balance||0)/Number(e.goal_amount)*100)));return '<div class="item"><div style="flex:1"><strong>'+esc(e.name)+'</strong><small>'+money(e.balance)+' из '+money(e.goal_amount)+' · '+percent+'%</small><div class="bar"><div class="fill" style="width:'+percent+'%"></div></div></div></div>'}).join(""):'<p class="empty">Пока нет целей с заданной суммой. Цели можно настроить в следующем обновлении.</p>')+'</div>'}}
function envelopeRow(e){const plan=Number(e.plan_amount||0),percent=plan?Math.min(100,Math.max(0,Math.round(Number(e.balance||0)/plan*100))):0;return '<div class="item"><div style="flex:1"><strong>'+esc(e.name)+'</strong><small>'+(e.private_other?"Личный · доступен только остаток":plan?"План "+money(plan):esc(e.type))+'</small>'+(!e.private_other&&plan?'<div class="bar"><div class="fill" style="width:'+percent+'%"></div></div>':"")+'</div><div class="amount '+(e.balance<0?"negative":"")+'">'+money(e.balance)+'</div></div>'}
async function refresh(){try{const data=await api("boot");if(!data.setup){update(data);notify("Данные обновлены")}}catch(err){notify(err.message)}}
function selectField(name,items){return '<label>'+name+'<select name="'+name+'" required>'+items.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.group_name)+' · '+esc(e.name)+' — '+money(e.balance)+'</option>').join("")+'</select></label>'}
function showForm(kind){const all=visible(),transfers=(state.envelopes||[]).filter(e=>!e.private_other);if((kind==="expense"&&!all.length)||(kind==="transfer"&&transfers.length<2)){notify("Недостаточно доступных конвертов");return}let fields="",title="";
if(kind==="expense"){title="Записать расход";fields=selectField("Конверт",all)}
if(kind==="income"){title="Общий доход";fields='<label>Тип дохода<select name="incomeKind"><option value="advance">Аванс</option><option value="salary">Зарплата</option><option value="bonus">Премия</option></select></label>'}
if(kind==="personal")title="Личный доход";
if(kind==="transfer"){title="Перевод между конвертами";fields=selectField("Откуда",transfers)+selectField("Куда",transfers)}
fields+='<label>Сумма, ₽<input name="amount" type="text" inputmode="decimal" placeholder="Например, 1250,50" required autocomplete="off"></label>';
if(kind!=="transfer"&&kind!=="income")fields+='<label>Комментарий<input name="comment" maxlength="300" placeholder="Необязательно"></label>';
el("editor").innerHTML='<div class="card"><h2>'+title+'</h2><form id="moneyForm">'+fields+'<div class="form-actions"><button class="primary" type="submit">Сохранить</button><button class="secondary" type="button" onclick="closeForm()">Отмена</button></div><p id="formError" class="error" role="alert"></p></form></div>';
el("moneyForm").onsubmit=ev=>saveForm(ev,kind);el("editor").scrollIntoView({behavior:"smooth",block:"nearest"});el("moneyForm").querySelector('input[name="amount"]').focus()}
function closeForm(){el("editor").innerHTML=""}
async function saveForm(ev,kind){ev.preventDefault();if(busy)return;const form=ev.currentTarget,d=new FormData(form),v=parseMoney(d.get("amount"));if(v===null){el("formError").textContent="Укажите положительную сумму (не более двух знаков после запятой)";return}let action,payload;
if(kind==="expense"){action="expense";payload={e:d.get("Конверт"),v,c:String(d.get("comment")||"").trim()}}
else if(kind==="income"){action="income";payload={kind:d.get("incomeKind"),v}}
else if(kind==="personal"){action="personal";payload={v,c:String(d.get("comment")||"").trim()}}
else{if(d.get("Откуда")===d.get("Куда")){el("formError").textContent="Выберите разные конверты";return}action="transfer";payload={from:d.get("Откуда"),to:d.get("Куда"),v}}
busy=true;const btn=form.querySelector('[type="submit"]');btn.disabled=true;try{update(await api(action,payload));notify("Операция сохранена")}catch(err){el("formError").textContent=err.message;btn.disabled=false}finally{busy=false}}
function exportSnapshot(){if(!state)return;const rows=[["Группа","Конверт","Остаток (руб.)","План (руб.)","Цель (руб.)"],...state.envelopes.filter(e=>!e.private_other).map(e=>[e.group_name,e.name,Number(e.balance||0)/100,Number(e.plan_amount||0)/100,Number(e.goal_amount||0)/100])];const csv="\uFEFF"+rows.map(row=>row.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="family-money-converts.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
boot();
</script></body></html>
