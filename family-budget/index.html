<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Семейный бюджет</title><style>body{font:15px system-ui;margin:0;background:#f3f3ef;color:#171713}.w{max-width:680px;margin:auto;padding:16px}.top{background:#171713;color:white;padding:20px;border-radius:20px}.sum{font-size:34px;font-weight:800}.a{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}button,input,select{padding:12px;border:0;border-radius:12px;font:inherit}button{font-weight:700}.c{background:white;margin:8px 0;padding:14px;border-radius:16px}.n{display:flex;justify-content:space-between;gap:10px}.m{color:#777;font-size:13px}.neg{color:#c43}.g{font-weight:800;margin-top:18px}.setup{max-width:440px;margin:10vh auto;padding:18px}.setup div{background:#fff;padding:18px;border-radius:18px}.setup input,.setup select{width:100%;box-sizing:border-box;margin:5px 0;border:1px solid #ddd}</style><div id="app"></div><script>let S=null,T=localStorage.fbtoken;if(!T){T=crypto.randomUUID()+crypto.randomUUID();localStorage.fbtoken=T}let A='https://vwapvcpodwvfzfmtoxhz.supabase.co/functions/v1/family-budget',M=n=>(n/100).toLocaleString("ru-RU")+" ₽";async function p(action,x={}){let r=await fetch(A,{method:"POST",headers:{"content-type":"application/json","x-device-token":T},body:JSON.stringify(Object.assign({action},x))}),j=await r.json();if(!j.ok)throw Error(j.error);return j}async function boot(){let j=await p("boot");j.setup?setup():go(j)}function setup(){app.innerHTML=`<div class="setup"><div><h1>Семейный бюджет</h1><input id="nm" placeholder="Ваше имя"><select id="rl"><option value="husband">Муж</option><option value="wife">Жена</option></select><input id="fam" placeholder="Название семьи" value="Наша семья"><button onclick="create()">Создать семью</button><hr><input id="cd" placeholder="Код приглашения"><button onclick="join()">Вступить по коду</button></div></div>`}async function create(){go(await p("create",{name:nm.value,role:rl.value,family:fam.value}))}async function join(){go(await p("join",{name:nm.value,code:cd.value}))}function go(j){S=j;render()}function opts(){return S.envelopes.filter(e=>!e.private_other&&e.type!=="system").map(e=>`<option value="${e.id}">${e.name} — ${M(e.balance)}</option>`).join("")}async function expense(){let L=S.envelopes.filter(x=>!x.private_other&&x.type!=="system"),i=Number(prompt("Из какого конверта? Введите номер:\n"+L.map((x,n)=>(n+1)+". "+x.name+" — "+M(x.balance)).join("\n")))-1,e=L[i]?.id;if(!e)return;let v=prompt("Сумма, ₽");if(v)go(await p("expense",{e,v:Math.round(parseFloat(v.replace(",","."))*100),c:prompt("Комментарий","")}))}async function income(){let k=prompt("Тип: advance / salary / bonus","advance"),v=prompt("Сумма, ₽","77430");if(v)go(await p("income",{kind:k,v:Math.round(parseFloat(v)*100)}))}async function personal(){let v=prompt("Мой доход, ₽");if(v)go(await p("personal",{v:Math.round(parseFloat(v)*100),c:prompt("Комментарий","")}))}async function transfer(){let L=S.envelopes.filter(x=>!x.private_other),fi=Number(prompt("Откуда? Введите номер:\n"+L.map((x,n)=>(n+1)+". "+x.name+" — "+M(x.balance)).join("\n")))-1,f=L[fi]?.id;if(!f)return;let ti=Number(prompt("Куда? Введите номер:\n"+L.map((x,n)=>(n+1)+". "+x.name).join("\n")))-1,t=L[ti]?.id,v=prompt("Сумма, ₽");if(t&&v)go(await p("transfer",{from:f,to:t,v:Math.round(parseFloat(v.replace(",","."))*100)}))}function render(){let G={};S.envelopes.forEach(e=>(G[e.group_name]||(G[e.group_name]=[])).push(e));let h=`<div class="w"><div class="top"><div class="m" style="color:#bbb">${S.household.name} · ${S.member.name}</div><div class="sum">${M(S.total)}</div><div>Код семьи: <b>${S.household.invite_code}</b></div></div><div class="a"><button onclick="expense()">− Расход</button><button onclick="income()">+ Получка</button><button onclick="personal()">+ Мой доход</button><button onclick="transfer()">⇄ Перевод</button></div>`;for(let g in G){h+=`<div class="g">${g}</div>`;for(let e of G[g])h+=`<div class="c"><div class="n"><div><b>${e.name}</b><div class="m">${e.private_other?"только остаток":e.plan_amount?"план "+M(e.plan_amount):e.type}</div></div><b class="${e.balance<0?"neg":""}">${M(e.balance)}</b></div></div>`}app.innerHTML=h+"</div>"}boot()</script>
