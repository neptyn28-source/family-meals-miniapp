<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1411" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ДОМА — семейное приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Каркас (шапка, вкладки, экраны) строит app-v2.js: так новый вид появляется,
       даже если Telegram показал эту страницу из кэша. -->
  <main class="app"></main>

  <script>
    const appScript = document.createElement("script");
    appScript.src = "app-v2.js?v=" + Date.now();
    document.body.appendChild(appScript);
  </script>
</body>
</html>
